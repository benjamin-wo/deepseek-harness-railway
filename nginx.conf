# =============================================================================
# nginx.conf.template
#
# Rendered to /etc/nginx/nginx.conf at container startup by start.sh via:
#   envsubst '${PORT} ${DSH_INTERNAL_PORT}' < nginx.conf.template > nginx.conf
#
# Only $PORT and $DSH_INTERNAL_PORT are substituted — every other `$variable`
# below (e.g. $http_upgrade, $remote_addr, $host) is a native nginx runtime
# variable and is intentionally left untouched by envsubst's explicit
# variable allow-list.
# =============================================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ---- WebSocket upgrade header mapping ----------------------------------
    # Only set Connection: upgrade when the client actually sends an Upgrade header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Allow large diffs / file uploads through the harness UI.
    client_max_body_size 50M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen ${PORT} default_server;
        server_name _;

        # ---------------------------------------------------------------
        # HTTP Basic Auth — credentials generated at startup by start.sh
        # from the AUTH_USER / AUTH_PASSWORD environment variables.
        # ---------------------------------------------------------------
        auth_basic           "Restricted DeepSeek Harness";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://127.0.0.1:${DSH_INTERNAL_PORT};

            # ---- WebSocket / SSE streaming support ----------------------
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Explicitly forward the Authorization header so the upstream
            # (dsh web) receives credentials and the browser never sees a
            # spurious 401 challenge that triggers a re-prompt.
            proxy_set_header Authorization $http_authorization;

            # Critical for real-time token streaming: nginx must not
            # buffer the upstream response before forwarding it.
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
